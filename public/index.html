<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HQ Search 网页搜索" />
    <title>HQ Search</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo" href="/" aria-label="HQ Search 首页">
        <span>H</span><span>Q</span><span class="logo-space"></span><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
      </a>
      <div class="header-search" id="header-search"></div>
    </header>

    <main>
      <section class="home" id="home">
        <div class="home-logo logo" role="img" aria-label="HQ Search">
          <span>H</span><span>Q</span><span class="logo-space"></span><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
        </div>
        <div class="home-search" id="home-search"></div>
        <div class="home-actions">
          <button type="submit" form="search-form">HQ Search 搜索</button>
          <button type="button" id="home-syntax">搜索语法</button>
        </div>
      </section>

      <section class="results-page" id="results-page" hidden>
        <div class="results-toolbar">
          <nav class="time-tabs" aria-label="搜索时间范围">
            <a href="#" data-range="all" aria-current="page">全部</a>
            <a href="#" data-range="week">近一周</a>
            <a href="#" data-range="month">近一月</a>
            <a href="#" data-range="year">近一年</a>
            <a href="#" data-range="custom">自定义</a>
          </nav>
          <div class="toolbar-tools">
            <label class="filter">语言
              <select id="lang-filter" aria-label="搜索语言">
                <option value="">不限</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <button class="text-button" id="syntax-button" type="button">搜索语法</button>
            <button class="text-button" id="clear-filters" type="button" hidden>清除筛选</button>
          </div>
        </div>
        <div class="filters" id="filters">
          <div class="filter-dates" id="date-filter" hidden>
            <label>开始 <input id="after-filter" type="date" aria-label="开始日期" /></label>
            <label>结束 <input id="before-filter" type="date" aria-label="结束日期" /></label>
          </div>
          <p class="filter-status" id="filter-status" role="status"></p>
        </div>
        <div class="results-content">
          <div class="results-meta" id="results-meta"></div>
          <div class="status" id="status" role="status" aria-live="polite"></div>
          <div class="results-list" id="results-list"></div>
        </div>
        <nav class="pager" id="pager" hidden aria-label="搜索结果分页"></nav>
      </section>
    </main>

    <template id="search-template">
      <form class="search-form" id="search-form" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        <input name="q" type="search" placeholder="搜索网页" autocomplete="off" maxlength="128" aria-label="搜索词" required />
        <button class="clear-button" type="button" aria-label="清除搜索词" hidden>×</button>
        <span class="search-divider" aria-hidden="true"></span>
        <button class="submit-button" type="submit" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        </button>
      </form>
    </template>

    <footer class="footer"><span>HQ Search</span><span>搜索结果由 DeepSeek 提供</span></footer>

    <dialog class="syntax-dialog" id="syntax-dialog" aria-labelledby="syntax-title">
      <form method="dialog">
        <div class="dialog-bar">
          <h2 id="syntax-title">搜索语法</h2>
          <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
        </div>
        <p>可以直接写在搜索框里。语言和日期也可以用结果页上的选项，两者会叠加。限定站点请写在搜索词里。</p>
        <table class="syntax-list">
          <tbody>
            <tr><th><button type="button" class="syntax-example" data-insert="site:github.com">site:github.com</button></th><td>只搜索该站点，多个站点用 OR 连接</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert="-site:example.com">-site:example.com</button></th><td>排除站点</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert="-广告">-广告</button></th><td>排除关键词</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert='-"release notes"'>-"release notes"</button></th><td>排除短语</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert='"精确短语"'>"精确短语"</button></th><td>精确匹配</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert="lang:zh,en">lang:zh,en</button></th><td>限定语言，多种语言用逗号分隔</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert="after:2025-01-01">after:2025-01-01</button></th><td>该日期之后</td></tr>
            <tr><th><button type="button" class="syntax-example" data-insert="before:2026-06-01">before:2026-06-01</button></th><td>该日期之前</td></tr>
          </tbody>
        </table>
        <p class="syntax-status" id="syntax-status" role="status"></p>
      </form>
    </dialog>

    <dialog class="preview-dialog" id="preview-dialog" aria-labelledby="preview-title">
      <div class="dialog-bar">
        <div class="preview-heading">
          <h2 id="preview-title">预览正文</h2>
          <a id="preview-open" href="" target="_blank" rel="noopener noreferrer">打开原网页</a>
        </div>
        <button class="dialog-close" id="preview-close" type="button" aria-label="关闭预览">×</button>
      </div>
      <p class="preview-status" id="preview-status" role="status"></p>
      <div class="preview-body" id="preview-body"></div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
